[ci]
runner = "ubuntu-24.04"
provider = "actions"
platform = "github"
required_gates = [{ id = "harbor-ci", run = "nix develop -c harbor-ci full" }]
runtime = "nix"
all_features = false
packages = ["nix-manager-core"]
with_msrv = true
with_audit = true
with_docs = true
publish_crates = true
extra_env = { RUSTDOCFLAGS = "-D warnings" }

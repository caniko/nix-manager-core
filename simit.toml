[prebuild]
publish_attic = true
attic_app = ".#push-flake-inputs"

[prebuild.system_runners]
"x86_64-linux" = "ubuntu-24.04"

[ci]
runner = "codefloe-global"
step_runners = { cargo-clippy = "codeberg-small", cargo-doc = "codeberg-small", cargo-fmt = "codeberg-tiny", cargo-package = "codeberg-medium", cargo-test = "codeberg-medium", quality-tools = "codeberg-small" }
provider = "crow"
platform = "forgejo"

[release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "nix-manager-core"
token_secret = "ATTIC_TOKEN"

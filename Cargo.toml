[workspace]
resolver = "2"
members = ["crates/nix-manager-core"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "MIT"
repository = "https://github.com/caniko/nix-manager-core"
authors = ["caniko"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
console = "0.16"
dialoguer = "0.12"
hostname = "0.4"
indicatif = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
forgejo-api = { version = "0.11.1", default-features = false, features = [
  "sync",
  "rustls-tls",
] }
url = "2"
libc = "0.2"
age = { version = "0.11.5", default-features = false, features = ["plugin"] }
age-core = { version = "0.11", features = ["plugin"] }

[workspace.metadata.crane]
name = "nix-manager-core"

[workspace.metadata.harbor-ci]
docs = true
audit = true
deny = true
package = true

[profile.release]
lto = true
strip = true

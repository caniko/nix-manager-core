[licenses]
version = 2
# Permissive licenses present in the qualified dependency graph.
allow = [
  "Apache-2.0",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[advisories]
version = 2
# Compile-time only: age's `fl!` localization proc-macro (i18n-embed-fl /
# i18n-config) still requires these, with no maintained replacement upstream.
# Neither reaches the built library. Drop when age stops using i18n-embed-fl.
ignore = [
  { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2: compile-time only, via age's i18n-embed-fl" },
  { id = "RUSTSEC-2026-0374", reason = "basic-toml: compile-time only, via age's i18n-config" },
]

[package]
name = "nix-manager-core"
description = "Support library for manager-flake Rust projects: ui, exec, repo, age, forge, health, parallel, build, user"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
readme = "README.md"
documentation = "https://docs.rs/nix-manager-core"
keywords = ["nix", "nixos", "deployment", "derivation", "manager"]
categories = ["development-tools", "config"]
include = [
  "/src/**",
  "/tests/**",
  "/README.md",
  "/LICENSE",
  "/Cargo.toml",
  "/Cargo.lock",
]

[package.metadata.docs.rs]
all-features = true

[lib]
name = "nix_manager_core"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
console.workspace = true
dialoguer.workspace = true
hostname.workspace = true
indicatif.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
walkdir.workspace = true
libc.workspace = true
forgejo-api.workspace = true
url.workspace = true
tempfile.workspace = true
